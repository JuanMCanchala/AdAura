[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
hashkey_testnet = "https://testnet.hsk.xyz"
sepolia = "${SEPOLIA_RPC_URL}"
